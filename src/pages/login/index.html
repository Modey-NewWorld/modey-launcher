        <div class="login-card">
          <img src="/src/static/images/logo.png" class="logo" alt="Logo" />
          <h1>Modey Launcher</h1>
          <p class="subtitle">Identifiez-vous pour accéder à vos serveurs.</p>
          <p style="font-size:11px;color:var(--text-muted);margin:-8px 0 16px 0;"><i class="fa-solid fa-server"></i>&nbsp;Compte officiel Modey</p>

          <div class="auth-tabs" style="display:flex;gap:8px;margin-bottom:16px;">
            <button type="button" id="tab-auth-login" class="btn btn-secondary active" style="flex:1;padding:8px;font-size:12px;font-weight:600;">Se connecter</button>
            <button type="button" id="tab-auth-register" class="btn btn-secondary" style="flex:1;padding:8px;font-size:12px;font-weight:600;">Créer un compte</button>
          </div>

          <form id="form-login-custom" class="login-custom-form">
            <div class="input-group" id="group-email" style="display:none;">
              <label for="input-email"><i class="fa-solid fa-envelope"></i> Adresse Email</label>
              <input type="email" id="input-email" class="input-field" placeholder="joueur@modey.net" autocomplete="off" />
            </div>

            <div class="input-group" id="group-username">
              <label for="input-username" id="label-username"><i class="fa-solid fa-user"></i> Pseudo ou Email</label>
              <input type="text" id="input-username" class="input-field" placeholder="Votre pseudo ou email" required minlength="3" maxlength="32" autocomplete="off" />
              <small class="input-hint" id="username-hint">Votre pseudo unique de joueur</small>
            </div>

            <div class="input-group" id="group-password">
              <label for="input-password"><i class="fa-solid fa-lock"></i> Mot de passe</label>
              <input type="password" id="input-password" class="input-field" placeholder="••••••••" required minlength="6" autocomplete="current-password" />
            </div>

            <button type="submit" id="btn-login-custom" class="btn btn-primary btn-submit-custom">
              <i class="fa-solid fa-right-to-bracket"></i>
              <span id="btn-submit-text">Se connecter à Modey</span>
            </button>

            <button type="button" id="btn-forgot-password" class="btn btn-secondary" disabled title="Bientôt disponible" style="width:100%;margin-top:8px;opacity:0.5;cursor:not-allowed;">
              <i class="fa-solid fa-key"></i>
              <span>Mot de passe oublié</span>
            </button>
          </form>

          <div class="login-footer">
            <small>Plateforme de jeu <strong>Modey</strong></small>
          </div>
        </div>
