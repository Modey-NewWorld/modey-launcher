<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modey Launcher</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('modey-theme');
          var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = (saved === 'dark' || (!saved || saved === 'system') && isDark) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {}
      })();
    </script>
    <style>
      /* CSS critique anti-FOUC : appliqué avant le bundle, support clair et sombre */
      html, body { margin: 0; height: 100%; background-color: #F3F5F9; overflow: hidden; font-family: 'Instrument Sans', system-ui, sans-serif; }
      [data-theme="dark"] html, [data-theme="dark"] body { background-color: #0B1017; color: #F0F4F8; }
      div.view:not(.active) { display: none; }
      body:not(.loaded) div#app { opacity: 0 !important; visibility: hidden; }
      div#app { transition: opacity 0.3s ease-out; }
      div#view-loading {
        position: fixed; top: 0; left: 0;
        display: flex; justify-content: center; align-items: center;
        height: 100vh; width: 100vw;
        padding-top: 36px; box-sizing: border-box;
        background-color: #F3F5F9; color: #24374F;
        font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 13px;
        opacity: 1;
        transition: opacity 0.25s ease-out, visibility 0s linear 0s;
        z-index: 9999;
      }
      [data-theme="dark"] div#view-loading {
        background-color: #0B1017; color: #F0F4F8;
      }
      [data-theme="dark"] div#view-maintenance,
      [data-theme="dark"] div#view-update {
        background-color: #0B1017; color: #F0F4F8;
      }
      div#view-loading.loaded { opacity: 0; pointer-events: none !important; visibility: hidden; transition: opacity 0.25s ease-out, visibility 0s linear 0.25s; }
      div#view-loading .loading-card {
        display: grid;
        grid-template-rows: 1fr auto 1fr;
        justify-items: center;
        align-items: center;
        width: 100%; height: 100%;
        text-align: center;
      }
      div#view-loading .loading-logo {
        grid-row: 2;
        width: 48px; height: 48px; object-fit: contain;
      }
      div#view-loading .loading-bottom {
        grid-row: 3; align-self: start;
        margin-top: 14px;
        display: flex; flex-direction: column; align-items: center; gap: 6px;
      }
      div#view-loading .spinner {
        font-size: 1.5rem; color: #1B6FD6; margin: 0;
      }
      [data-theme="dark"] div#view-loading .spinner {
        color: #3B82F6;
      }
      .solar-icon {
        display: inline-block;
        width: 1em;
        height: 1em;
        vertical-align: -0.15em;
        fill: currentColor;
      }
      .solar-icon.spin {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <div id="titlebar">
      <div class="titlebar-drag"></div>
    </div>

    <div id="view-loading" class="loading" data-view="loading">
      <div class="loading-card">
        <img src="/src/static/images/logo.png" class="loading-logo" alt="Modey" />
        <div class="loading-bottom">
          <p class="spinner"><svg class="solar-icon solar-bold spin" aria-hidden="true"><use href="#solar-refresh-bold"></use></svg></p>
          <p class="text">Chargement...</p>
        </div>
      </div>
    </div>

    <div id="view-maintenance" class="maintenance" data-view="maintenance">
      <div class="maintenance-card">
        <p class="gears" id="maintenance-icon"><svg class="solar-icon solar-bold" aria-hidden="true"><use href="#solar-settings-bold"></use></svg></p>
        <h3 id="maintenance-title">Maintenance</h3>
        <div id="maintenance-staff-badge" class="maint-staff-badge" style="display:none;"></div>
        <p class="dates" id="maintenance-dates"></p>
        <p class="text" id="maintenance-reason"></p>
        <div style="margin-top: 24px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;" id="maintenance-actions">
          <button id="btn-maint-bypass" class="btn btn-admin-bypass" style="display:none; padding: 10px 24px; font-weight: 700; border-radius: 8px; border: none; cursor: pointer; align-items: center; gap: 8px; font-size: 14px; font-family: inherit; transition: all 0.2s;">
            <svg class="solar-icon solar-bold" aria-hidden="true"><use href="#solar-login-bold"></use></svg> Accéder au Launcher
          </button>
          <button id="btn-maint-retry" class="btn btn-primary" style="padding: 10px 22px; font-weight: 600; border-radius: 8px; background: var(--accent); color: #fff; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 14px; font-family: inherit; box-shadow: 0 4px 12px var(--accent-ring);">
            <svg class="solar-icon solar-bold" aria-hidden="true"><use href="#solar-refresh-bold"></use></svg> Réessayer
          </button>
          <button id="btn-maint-logout" class="btn btn-secondary" style="padding: 10px 18px; font-weight: 600; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-family: inherit;">
            <svg class="solar-icon solar-bold" aria-hidden="true"><use href="#solar-logout-bold"></use></svg> Changer de compte
          </button>
        </div>
      </div>
    </div>

    <div id="view-update" class="update" data-view="update">
      <div class="maintenance-card">
        <p class="up"><svg class="solar-icon solar-bold" aria-hidden="true"><use href="#solar-download-bold"></use></svg></p>
        <h3>Une mise à jour est disponible</h3>
        <p class="text" id="update-text">Merci de patienter pendant la mise à jour du launcher...</p>
        <div class="progress-container" id="update-progress-container">
          <div class="progress-info">
            <span id="update-progress-label">Téléchargement...</span>
            <span id="update-progress-percent">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="update-progress-bar"></div>
          </div>
        </div>
        <div id="update-error-container" style="display: none; margin-top: 18px; flex-direction: column; gap: 10px; align-items: center;">
          <p id="update-error-text" style="color: var(--danger); font-size: 13px; font-weight: 500; margin: 0; text-align: center; max-width: 320px;"></p>
          <div style="display: flex; gap: 10px;">
            <button id="btn-update-retry" class="btn btn-primary" style="padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer;">
              <svg class="solar-icon solar-bold" aria-hidden="true"><use href="#solar-refresh-bold"></use></svg> Réessayer
            </button>
            <button id="btn-update-manual" class="btn btn-secondary" style="padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer;">
              <svg class="solar-icon solar-bold" aria-hidden="true"><use href="#solar-download-bold"></use></svg> Télécharger manuellement
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="app">
      <div class="app-background"></div>
      <div id="view-login" class="view" data-view="login"></div>
      <div id="view-home" class="view" data-view="home"></div>
